<!doctype html>
<html lang="en">

    <script>
      // Gracefully filter benign Vite HMR websocket messages in sandboxed cloud container environment
      (() => {
        // Intercept Vite WebSocket instantiation before @vite/client attempts network upgrade
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OrigWebSocket = window.WebSocket;
          class FakeViteWebSocket extends EventTarget {
            constructor(url, protocols) {
              super();
              this.url = url;
              this.protocols = protocols;
              this.readyState = 0; // CONNECTING
              this.CONNECTING = 0;
              this.OPEN = 1;
              this.CLOSING = 2;
              this.CLOSED = 3;
              this.bufferedAmount = 0;
              this.extensions = '';
              this.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || '');
              this.binaryType = 'blob';
              this.onopen = null;
              this.onclose = null;
              this.onerror = null;
              this.onmessage = null;

              // Immediately transition to OPEN state to cleanly satisfy Vite client
              queueMicrotask(() => {
                if (this.readyState === 0) {
                  this.readyState = 1; // OPEN
                  const openEvt = new Event('open');
                  if (typeof this.onopen === 'function') {
                    try { this.onopen(openEvt); } catch (_) {}
                  }
                  this.dispatchEvent(openEvt);
                }
              });
            }

            send(data) {
              // Silently sink Vite ping packets
            }

            close(code = 1000, reason = '') {
              this.readyState = 3; // CLOSED
              const closeEvt = new Event('close');
              if (typeof this.onclose === 'function') {
                try { this.onclose(closeEvt); } catch (_) {}
              }
              this.dispatchEvent(closeEvt);
            }
          }

          window.WebSocket = function (url, protocols) {
            const strUrl = String(url || '');
            const isViteSocket =
              strUrl.includes('token=') ||
              strUrl.includes('vite') ||
              protocols === 'vite-hmr' ||
              protocols === 'vite-ping' ||
              (Array.isArray(protocols) && (protocols.includes('vite-hmr') || protocols.includes('vite-ping')));

            if (isViteSocket) {
              return new FakeViteWebSocket(url, protocols);
            }
            return new OrigWebSocket(url, protocols);
          };

          Object.assign(window.WebSocket, OrigWebSocket);
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        const isViteNotice = (arg) => {
          if (!arg) return false;
          if (typeof arg === 'string') {
            const lower = arg.toLowerCase();
            return (
              lower.includes('vite') ||
              lower.includes('[vite]') ||
              lower.includes('failed to connect to websocket') ||
              lower.includes('vite-ping') ||
              lower.includes('connecting to websocket') ||
              lower.includes('connected.') ||
              lower.includes('ws://') ||
              lower.includes('wss://') ||
              (lower.includes('websocket') && (lower.includes('connection') || lower.includes('failed') || lower.includes('closed') || lower.includes('error') || lower.includes('refused')))
            );
          }
          if (arg instanceof Error) {
            return isViteNotice(arg.message) || isViteNotice(arg.stack);
          }
          if (typeof arg === 'object') {
            try {
              if (arg.message && isViteNotice(arg.message)) return true;
              if (arg.reason && isViteNotice(arg.reason)) return true;
              if (arg.stack && isViteNotice(arg.stack)) return true;
              if (arg.target && (arg.target instanceof WebSocket || String(arg.target?.url || '').includes('vite'))) return true;
              if (arg.srcElement && (arg.srcElement instanceof WebSocket || String(arg.srcElement?.url || '').includes('vite'))) return true;
              return isViteNotice(String(arg));
            } catch {
              return false;
            }
          }
          return false;
        };

        const hasVite = (args) => {
          if (!args || !args.length) return false;
          return args.some(isViteNotice);
        };

        ['error', 'warn', 'log', 'info', 'debug'].forEach((method) => {
          const orig = console[method];
          if (typeof orig === 'function') {
            console[method] = function (...args) {
              if (hasVite(args)) {
                return;
              }
              orig.apply(console, args);
            };
          }
        });

        const prevOnError = window.onerror;
        window.onerror = function (msg, url, line, col, error) {
          if (isViteNotice(msg) || isViteNotice(url) || isViteNotice(error)) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };

        window.addEventListener('unhandledrejection', (event) => {
          const reason = event?.reason;
          if (isViteNotice(reason) || isViteNotice(reason?.message)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', (event) => {
          if (
            isViteNotice(event?.message) ||
            isViteNotice(event?.filename) ||
            isViteNotice(event?.error) ||
            (event?.target && event.target instanceof WebSocket)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
